<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شات بيني وبينك 💬</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .chat-container {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 82vh;
  }
  .chat-header-bar {
    background: linear-gradient(135deg, #ff6b6b, #ff9ff3);
    padding: 18px 20px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }
  .chat-messages-area {
    flex: 1;
    background: #fdfdfd;
    color: #333;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    direction: rtl;
  }
  .chat-message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    word-break: break-word;
    position: relative;
  }
  .chat-message.me {
    align-self: flex-start;
    background: #ff6b6b;
    color: #fff;
    border-bottom-left-radius: 2px;
  }
  .chat-message.other {
    align-self: flex-end;
    background: #fff;
    color: #333;
    border-bottom-right-radius: 2px;
    border: 1px solid #eee;
  }
  .chat-msg-info {
    font-size: 0.8rem;
    opacity: 0.8;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }
  .chat-msg-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 6px;
    font-size: 0.75rem;
    opacity: 0.85;
    gap: 5px;
  }
  .seen-badge {
    cursor: pointer;
    background: rgba(0,0,0,0.1);
    padding: 2px 6px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: background 0.2s;
  }
  .seen-badge:hover {
    background: rgba(0,0,0,0.2);
  }
  .chat-input-bar {
    background: #fff;
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-name-row input, .chat-input-row input {
    width: 100%;
    padding: 12px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    background: #fdfdfd;
  }
  .chat-name-row input:focus, .chat-input-row input:focus {
    border-color: #ff6b6b;
  }
  .chat-input-row {
    display: flex;
    gap: 10px;
  }
  .chat-input-row button {
    padding: 0 25px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b6b, #ff9ff3);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(255,107,107,0.3);
    transition: transform 0.1s;
  }
  .chat-input-row button:active {
    transform: scale(0.95);
  }
  .chat-back-btn {
    margin-top: 20px;
    padding: 12px 30px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    background: rgba(255,255,255,0.3);
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s;
  }
  .chat-back-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header-bar">
    💬 شات مباشر
  </div>
  <div class="chat-messages-area" id="chatBody">
    <!-- Messages -->
  </div>
  <div class="chat-input-bar">
    <div class="chat-name-row">
      <input type="text" id="chatSenderInput" placeholder="اسمك (مثلا: جودي / أنا)" value="جودي" />
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatTextInput" placeholder="اكتب رسالتك هنا..." />
      <button id="chatSendBtn">إرسال</button>
    </div>
  </div>
</div>

<a href="index.html" class="chat-back-btn">⬅ العودة للموقع الرئيسي</a>

<script>
const chatBody = document.getElementById('chatBody');
const chatSenderInput = document.getElementById('chatSenderInput');
const chatTextInput = document.getElementById('chatTextInput');
const chatSendBtn = document.getElementById('chatSendBtn');

const savedSender = localStorage.getItem('chat_sender_name');
if (savedSender) {
  chatSenderInput.value = savedSender;
}

chatSenderInput.addEventListener('input', () => {
  localStorage.setItem('chat_sender_name', chatSenderInput.value.trim());
});

chatSendBtn.addEventListener('click', sendMessage);
chatTextInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// Robust time formatter
function formatTime() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = now.getMinutes();
  const ampm = hours >= 12 ? 'م' : 'ص';
  hours = hours % 12;
  hours = hours ? hours : 12;
  const strM = minutes < 10 ? '0' + minutes : minutes;
  return hours + ':' + strM + ' ' + ampm;
}

function sendMessage() {
  const sender = chatSenderInput.value.trim() || 'مجهول';
  const text = chatTextInput.value.trim();
  if (!text) return;

  const time = formatTime();
  chatSendBtn.disabled = true;

  fetch('/api/messages', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sender, text, time })
  })
  .then(res => res.json())
  .then(() => {
    chatSendBtn.disabled = false;
    chatTextInput.value = '';
    fetchMessages();
  })
  .catch(err => {
    chatSendBtn.disabled = false;
    console.error(err);
    alert('حدث خطأ أثناء الإرسال.');
  });
}

let lastMessagesJson = '';
let lastNotifCount = -1;

// Request Notification Permission
if ('Notification' in window) {
  if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
    document.addEventListener('click', () => {
      Notification.requestPermission().catch(() => {});
    }, { once: true });
  }
}

function fetchMessages() {
  fetch('/api/messages')
    .then(res => res.json())
    .then(messages => {
      if (!Array.isArray(messages)) messages = [];

      const currentSender = chatSenderInput.value.trim();

      // Mark unread messages from other user as seen
      messages.forEach(msg => {
        if (msg.sender !== currentSender && (!msg.seen_by || !msg.seen_by.includes(currentSender))) {
          markAsSeen(msg.id, currentSender);
        }
      });

      if (lastNotifCount !== -1 && messages.length > lastNotifCount) {
        const latest = messages[messages.length - 1];
        if (latest.sender !== currentSender && document.hidden) {
          if ('Notification' in window && Notification.permission === 'granted') {
            try {
              new Notification(`💬 رسالة جديدة من ${latest.sender}`, {
                body: latest.text,
                icon: 'https://cdn-icons-png.flaticon.com/512/893/893257.png'
              });
            } catch(e) {}
          }
        }
      }
      lastNotifCount = messages.length;

      const jsonStr = JSON.stringify(messages);
      if (jsonStr === lastMessagesJson) return;
      lastMessagesJson = jsonStr;

      chatBody.innerHTML = '';
      if (messages.length === 0) {
        chatBody.innerHTML = '<div style="text-align:center; color:#888; font-size:1rem; margin-top:40px;">مفيش رسائل لسه، ابدأ الكلام! 💬</div>';
        return;
      }

      messages.forEach(msg => {
        const div = document.createElement('div');
        const isMe = (msg.sender === currentSender);
        div.className = 'chat-message ' + (isMe ? 'me' : 'other');

        let seenHtml = '';
        if (isMe && msg.seen_by) {
          seenHtml = `<span class="seen-badge" onclick="showSeenInfo('${escapeHtml(msg.seen_by)}')">👁️ تمت رؤيتها بواسطة: ${escapeHtml(msg.seen_by)}</span>`;
        }

        div.innerHTML = `
          <div class="chat-msg-info">
            <span><b>${escapeHtml(msg.sender)}</b></span>
            <span>${escapeHtml(msg.time || '')}</span>
          </div>
          <div>${escapeHtml(msg.text)}</div>
          ${seenHtml ? `<div class="chat-msg-footer">${seenHtml}</div>` : ''}
        `;
        chatBody.appendChild(div);
      });
      scrollToBottom();
    })
    .catch(err => console.error(err));
}

function markAsSeen(msgId, readerName) {
  fetch('/api/messages', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: 'seen', id: msgId, seen_by: readerName })
  }).catch(err => console.error(err));
}

function showSeenInfo(seenBy) {
  alert('👁️ تمت رؤية هذه الرسالة بواسطة: ' + seenBy);
}

function scrollToBottom() {
  chatBody.scrollTop = chatBody.scrollHeight;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

fetchMessages();
setInterval(fetchMessages, 2500);
</script>
</body>
</html>
